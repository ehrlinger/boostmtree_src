# R CMD check for the boostmtree CCF fork.
#
# NOTE ON LAYOUT: the R package lives in the boostmtree/ SUBDIRECTORY; there is
# no DESCRIPTION at the repository root. Every R step therefore points at that
# subdirectory via the `working-directory` input, which is what makes pak read
# boostmtree/DESCRIPTION rather than failing at the root.
#
# Matrix is R release on all three OSes only. This is a team fork, not a CRAN
# submission, so oldrel/devel are deliberately omitted. Windows is the point of
# the matrix: this fork has never been checked there.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # dependencies: "all" pulls Suggests as well as Imports, so
      # Suggests: testthat is installed and the testthat suite actually runs.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: boostmtree
          dependencies: '"all"'
          extra-packages: any::rcmdcheck
          needs: check

      # args below is the action's own default spelled out: --as-cran is on.
      # --no-manual avoids requiring a LaTeX install on the runners; the PDF
      # manual is checked locally as part of the release gate instead.
      # upload-results: 'false' is the default and means "upload the check
      # directory as an artifact on failure only".
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: boostmtree
          args: 'c("--no-manual", "--as-cran")'
          build_args: '"--no-manual"'
          error-on: '"warning"'
          upload-results: 'false'
